<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Master Item — Kopi Telu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--brown:#92400e;--amber:#b45309;--light:#fffbf5;--card:#fff;--border:#e5d8c8;--text:#1c1410;--muted:#7a6652;--green:#059669;--red:#dc2626;--blue:#2563eb;--orange:#ea580c}
    body{font-family:'DM Sans',sans-serif;background:var(--light);color:var(--text);min-height:100vh}
    header{background:var(--brown);color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px #92400e44}
    .header-left{display:flex;align-items:center;gap:10px}
    .logo{width:32px;height:32px;background:#78350f;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px}
    .app-name{font-family:'DM Serif Display',serif;font-size:17px}
    .btn-link{color:#fcd34d;font-size:13px;cursor:pointer;background:none;border:none;text-decoration:none}
    .user-badge{background:#78350f;padding:3px 10px;border-radius:99px;font-size:12px;color:#fff}
    main{max-width:900px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:14px;padding-bottom:40px}
    .card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px}
    .item-row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--border)}
    .item-row:last-child{border-bottom:none}
    .item-row:hover{background:var(--light)}
    .item-icon{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
    .item-nama{font-size:14px;font-weight:600}
    .item-meta{font-size:11px;color:var(--muted);margin-top:2px}
    .badge{display:inline-block;font-size:10px;font-weight:600;padding:2px 8px;border-radius:99px;margin-left:4px}
    .badge-gudang{background:#dbeafe;color:#1e40af}
    .badge-outlet{background:#d1fae5;color:#065f46}
    .btn-sm{border:none;border-radius:8px;padding:6px 12px;font-size:12px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif}
    .btn-primary{background:var(--brown);color:#fff}
    .btn-secondary{background:var(--light);border:1.5px solid var(--border);color:var(--text)}
    .toggle-wrap{display:flex;align-items:center;gap:6px;cursor:pointer}
    .toggle{width:36px;height:20px;border-radius:99px;position:relative;transition:background .2s;flex-shrink:0}
    .toggle.on{background:var(--blue)}
    .toggle.off{background:#d1d5db}
    .toggle::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 3px #0003}
    .toggle.on::after{left:18px}
    .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;align-items:flex-end;justify-content:center}
    .modal-overlay.show{display:flex}
    @media(min-width:560px){.modal-overlay{align-items:center}}
    .modal{background:var(--card);border-radius:20px 20px 0 0;padding:24px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto}
    @media(min-width:560px){.modal{border-radius:20px}}
    .modal-title{font-family:'DM Serif Display',serif;font-size:18px;margin-bottom:16px}
    .form-group{margin-bottom:12px}
    .form-group label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:4px}
    .form-group input,.form-group select{width:100%;border:1.5px solid var(--border);border-radius:10px;padding:9px 12px;font-size:13px;font-family:'DM Sans',sans-serif;color:var(--text);background:#fafaf8;outline:none}
    .form-group input:focus,.form-group select:focus{border-color:var(--amber)}
    .btn-full{width:100%;padding:13px;font-size:14px;font-weight:700;border:none;border-radius:12px;cursor:pointer;font-family:'DM Sans',sans-serif;background:var(--brown);color:#fff;margin-top:4px}
    .btn-full:hover{background:var(--amber)}
    .btn-full:disabled{background:#d1b89a;cursor:not-allowed}
    .msg-error{background:#fef2f2;border:1px solid #fecaca;border-radius:8px;padding:8px 12px;font-size:12px;color:var(--red);margin-bottom:10px;display:none}
    .empty-state{text-align:center;padding:32px;color:var(--muted);font-size:13px}
    .search-bar{width:100%;border:1.5px solid var(--border);border-radius:10px;padding:9px 12px;font-size:13px;font-family:'DM Sans',sans-serif;outline:none;background:#fafaf8}
    .search-bar:focus{border-color:var(--amber)}
    .stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
    .stat-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;text-align:center}
    .stat-label{font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px}
    .stat-value{font-family:'DM Serif Display',serif;font-size:22px}
    @media(max-width:600px){main{padding:10px}.stat-grid{grid-template-columns:repeat(3,1fr)}}
  </style>
</head>
<body>

<header>
  <div class="header-left">
    <div class="logo">☕</div>
    <span class="app-name">Master Item</span>
  </div>
  <div style="display:flex;align-items:center;gap:10px">
    <span class="user-badge" id="user-badge">-</span>
    <a href="dashboard.html" id="link-dashboard" style="display:none" class="btn-link">📊 Dashboard</a>
    <a href="inventori.html" id="link-inventori" style="display:none" class="btn-link">← Inventori</a>
    <a href="home.html" id="link-menu" style="display:none" class="btn-link">← Menu</a>
    <button class="btn-link" onclick="doLogout()">Keluar →</button>
  </div>
</header>

<main>
  <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px">
    <div>
      <div style="font-family:'DM Serif Display',serif;font-size:22px">📋 Master Item</div>
      <div style="font-size:12px;color:var(--muted);margin-top:2px">Semua bahan baku — gudang dan outlet</div>
    </div>
    <button class="btn-sm btn-primary" onclick="openModalTambah()">+ Tambah Item</button>
  </div>

  <!-- Stats -->
  <div class="stat-grid">
    <div class="stat-card">
      <div class="stat-label">Total Item</div>
      <div class="stat-value" id="s-total" style="color:var(--brown)">-</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Di Gudang</div>
      <div class="stat-value" id="s-gudang" style="color:var(--blue)">-</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Outlet Only</div>
      <div class="stat-value" id="s-outlet" style="color:var(--green)">-</div>
    </div>
  </div>

  <!-- Filter & Search -->
  <div style="display:flex;gap:8px;flex-wrap:wrap">
    <input class="search-bar" id="search-item" placeholder="🔍 Cari item..." oninput="filterItems()" style="flex:1;min-width:160px"/>
    <select id="filter-tipe" onchange="filterItems()" style="border:1.5px solid var(--border);border-radius:10px;padding:8px 12px;font-size:13px;font-family:'DM Sans',sans-serif;background:#fafaf8">
      <option value="all">Semua</option>
      <option value="gudang">🏭 Di Gudang</option>
      <option value="outlet">🏪 Outlet Only</option>
    </select>
    <select id="filter-kategori" onchange="filterItems()" style="border:1.5px solid var(--border);border-radius:10px;padding:8px 12px;font-size:13px;font-family:'DM Sans',sans-serif;background:#fafaf8">
      <option value="all">Semua Kategori</option>
      <option value="bahan">🫘 Bahan Baku</option>
      <option value="kemasan">📦 Kemasan</option>
      <option value="operasional">🔧 Operasional</option>
      <option value="lainnya">📋 Lainnya</option>
    </select>
  </div>

  <!-- Item list -->
  <div class="card" style="padding:0;overflow:hidden">
    <div id="item-list"><div class="empty-state">Memuat...</div></div>
  </div>
</main>

<!-- Modal Tambah/Edit -->
<div class="modal-overlay" id="modal-item" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-title" id="modal-title">+ Tambah Item Baru</div>
    <div class="msg-error" id="item-error"></div>
    <div class="form-group">
      <label>Nama Item</label>
      <input type="text" id="item-nama" placeholder="Contoh: Biji Kopi Arabica"/>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      <div class="form-group">
        <label>Satuan</label>
        <input type="text" id="item-satuan" placeholder="gr, ml, pcs, pack..."/>
      </div>
      <div class="form-group">
        <label>Kategori</label>
        <select id="item-kategori">
          <option value="bahan">🫘 Bahan Baku</option>
          <option value="kemasan">📦 Kemasan</option>
          <option value="operasional">🔧 Operasional</option>
          <option value="lainnya">📋 Lainnya</option>
        </select>
      </div>
    </div>
    <!-- Toggle diGudang -->
    <div style="background:var(--light);border-radius:12px;padding:14px;margin-bottom:12px">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">
        <div>
          <div style="font-size:13px;font-weight:600">Kelola Stok di Gudang</div>
          <div style="font-size:11px;color:var(--muted)">Aktifkan jika item ini ada di gudang pusat</div>
        </div>
        <div class="toggle off" id="toggle-gudang" onclick="toggleGudang()"></div>
      </div>
      <!-- Stok & Min hanya muncul kalau diGudang aktif -->
      <div id="stok-fields" style="display:none;margin-top:10px;display:none">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
          <div class="form-group" style="margin-bottom:0">
            <label>Stok Awal</label>
            <input type="number" id="item-stok" placeholder="0" min="0" step="0.1"/>
          </div>
          <div class="form-group" style="margin-bottom:0">
            <label>Stok Minimum (Alert)</label>
            <input type="number" id="item-min" placeholder="0" min="0" step="0.1"/>
          </div>
        </div>
      </div>
    </div>
    <button class="btn-full" id="btn-simpan" onclick="submitItem()">Simpan Item</button>
  </div>
</div>

<script type="module">
  import { Auth, OutletManager } from './js/auth.js';
  import { initializeApp, getApps } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js';
  import { getFirestore, collection, addDoc, getDocs, doc, updateDoc, deleteDoc, query, orderBy } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js';

  const user = Auth.requireAuth('inventori');
  if (!user) throw new Error();
  document.getElementById('user-badge').textContent = user.nama;
  window.doLogout = () => Auth.logout();

  if (user.role === 'owner') {
    document.getElementById('link-dashboard').style.display = 'inline';
  } else {
    document.getElementById('link-inventori').style.display = 'inline';
  }

  const firebaseConfig = {
    apiKey: "AIzaSyAx4RfDW-UdkFf3m_wQuSdeptqssE7n2wU",
    authDomain: "cafe-shift-report-70c6c.firebaseapp.com",
    projectId: "cafe-shift-report-70c6c",
    storageBucket: "cafe-shift-report-70c6c.firebasestorage.app",
    messagingSenderId: "461174765046",
    appId: "1:461174765046:web:660d43de856294644343d7"
  };
  const app = getApps().length ? getApps()[0] : initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const KATEGORI_ICON = { bahan:'🫘', kemasan:'📦', operasional:'🔧', lainnya:'📋' };
  let allItems = [];
  let editId = null;
  let isGudang = false;

  async function loadItems() {
    try {
      const snap = await getDocs(query(collection(db, "inventori"), orderBy("nama")));
      allItems = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    } catch(e) {
      const snap = await getDocs(collection(db, "inventori"));
      allItems = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a,b) => a.nama?.localeCompare(b.nama));
    }
    updateStats();
    filterItems();
  }
  loadItems();

  function updateStats() {
    document.getElementById('s-total').textContent   = allItems.length;
    document.getElementById('s-gudang').textContent  = allItems.filter(i => i.diGudang !== false).length;
    document.getElementById('s-outlet').textContent  = allItems.filter(i => i.diGudang === false).length;
  }

  window.filterItems = function() {
    const q    = document.getElementById('search-item').value.toLowerCase();
    const tipe = document.getElementById('filter-tipe').value;
    const kat  = document.getElementById('filter-kategori').value;

    let filtered = allItems;
    if (q)              filtered = filtered.filter(i => i.nama.toLowerCase().includes(q));
    if (tipe === 'gudang') filtered = filtered.filter(i => i.diGudang !== false);
    if (tipe === 'outlet') filtered = filtered.filter(i => i.diGudang === false);
    if (kat !== 'all')  filtered = filtered.filter(i => (i.kategori||'lainnya') === kat);

    renderItems(filtered);
  };

  function renderItems(items) {
    const list = document.getElementById('item-list');
    if (!items.length) {
      list.innerHTML = '<div class="empty-state">Tidak ada item ditemukan</div>';
      return;
    }
    list.innerHTML = items.map(item => {
      const icon      = KATEGORI_ICON[item.kategori] || '📋';
      const diGudang  = item.diGudang !== false;
      return `<div class="item-row">
        <div class="item-icon" style="background:${diGudang?'#dbeafe':'#d1fae5'}">${icon}</div>
        <div class="item-info" style="flex:1">
          <div class="item-nama">${item.nama}
            <span class="badge ${diGudang?'badge-gudang':'badge-outlet'}">${diGudang?'🏭 Gudang':'🏪 Outlet'}</span>
          </div>
          <div class="item-meta">${item.satuan} · ${item.kategori||'lainnya'}${diGudang ? ` · Stok: ${item.stok||0} ${item.satuan} · Min: ${item.minStok||0} ${item.satuan}` : ''}</div>
        </div>
        <div style="display:flex;gap:6px;align-items:center">
          <div class="toggle-wrap" onclick="quickToggleGudang('${item.id}', ${diGudang})" title="${diGudang?'Nonaktifkan dari gudang':'Aktifkan di gudang'}">
            <div class="toggle ${diGudang?'on':'off'}"></div>
            <span style="font-size:11px;color:var(--muted)">Gudang</span>
          </div>
          <button class="btn-sm btn-secondary" onclick="openModalEdit('${item.id}')">Edit</button>
          <button class="btn-sm" onclick="hapusItem('${item.id}','${item.nama}')" style="background:#fef2f2;color:var(--red);border:1px solid #fecaca">Hapus</button>
        </div>
      </div>`;
    }).join('');
  }

  // Toggle diGudang langsung dari list
  window.quickToggleGudang = async (id, current) => {
    try {
      await updateDoc(doc(db, "inventori", id), { diGudang: !current, updatedAt: new Date().toISOString() });
      await loadItems();
    } catch(e) { alert('Error: ' + e.message); }
  };

  // Modal
  window.toggleGudang = function() {
    isGudang = !isGudang;
    const toggle = document.getElementById('toggle-gudang');
    const fields = document.getElementById('stok-fields');
    toggle.className = `toggle ${isGudang ? 'on' : 'off'}`;
    fields.style.display = isGudang ? 'block' : 'none';
  };

  window.openModalTambah = function() {
    editId = null;
    isGudang = false;
    document.getElementById('item-nama').value = '';
    document.getElementById('item-satuan').value = '';
    document.getElementById('item-stok').value = '0';
    document.getElementById('item-min').value = '0';
    document.getElementById('item-kategori').value = 'bahan';
    document.getElementById('toggle-gudang').className = 'toggle off';
    document.getElementById('stok-fields').style.display = 'none';
    document.getElementById('item-error').style.display = 'none';
    document.getElementById('modal-title').textContent = '+ Tambah Item Baru';
    document.getElementById('btn-simpan').textContent = 'Simpan Item';
    document.getElementById('modal-item').classList.add('show');
  };

  window.openModalEdit = function(id) {
    const item = allItems.find(i => i.id === id);
    if (!item) return;
    editId = id;
    isGudang = item.diGudang !== false;
    document.getElementById('item-nama').value    = item.nama;
    document.getElementById('item-satuan').value  = item.satuan;
    document.getElementById('item-stok').value    = item.stok || 0;
    document.getElementById('item-min').value     = item.minStok || 0;
    document.getElementById('item-kategori').value = item.kategori || 'bahan';
    document.getElementById('toggle-gudang').className = `toggle ${isGudang ? 'on' : 'off'}`;
    document.getElementById('stok-fields').style.display = isGudang ? 'block' : 'none';
    document.getElementById('item-error').style.display = 'none';
    document.getElementById('modal-title').textContent = '✏️ Edit Item';
    document.getElementById('btn-simpan').textContent = 'Update Item';
    document.getElementById('modal-item').classList.add('show');
  };

  window.submitItem = async function() {
    const nama     = document.getElementById('item-nama').value.trim();
    const satuan   = document.getElementById('item-satuan').value.trim();
    const kategori = document.getElementById('item-kategori').value;
    const stok     = parseFloat(document.getElementById('item-stok').value) || 0;
    const minStok  = parseFloat(document.getElementById('item-min').value) || 0;
    const errEl    = document.getElementById('item-error');

    if (!nama || !satuan) { errEl.style.display='block'; errEl.textContent='Nama dan satuan wajib diisi!'; return; }
    errEl.style.display = 'none';

    const btn = document.getElementById('btn-simpan');
    btn.disabled = true; btn.textContent = '⏳ Menyimpan...';

    try {
      const data = {
        nama, satuan, kategori, diGudang: isGudang,
        stok: isGudang ? stok : 0,
        minStok: isGudang ? minStok : 0,
        updatedAt: new Date().toISOString()
      };
      if (editId) {
        await updateDoc(doc(db, "inventori", editId), data);
      } else {
        await addDoc(collection(db, "inventori"), { ...data, createdAt: new Date().toISOString() });
      }
      closeModal();
      await loadItems();
    } catch(e) { errEl.style.display='block'; errEl.textContent='Error: '+e.message; }
    finally { btn.disabled=false; btn.textContent = editId ? 'Update Item' : 'Simpan Item'; }
  };

  window.hapusItem = async function(id, nama) {
    if (!confirm(`Hapus item "${nama}"? Tindakan ini tidak bisa dibatalkan.`)) return;
    try {
      await deleteDoc(doc(db, "inventori", id));
      await loadItems();
    } catch(e) { alert('Gagal hapus: ' + e.message); }
  };

  window.closeModal = () => document.getElementById('modal-item').classList.remove('show');
</script>
</body>
</html>
